name: CPH Trusted Gate

on:
  workflow_run:
    workflows: [CPH Native CI]
    types: [completed]

permissions: {}

concurrency:
  group: cph-sync-controller
  cancel-in-progress: false

jobs:
  collect:
    name: Verify native evidence and publish trusted status
    if: github.repository == 'oncehere/Cataclysm-Phantom-Hope'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout default-branch trusted collector
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify current candidate and protected merge rules
        env:
          GH_TOKEN: ${{ github.token }}
          CPH_RUN_ID: ${{ github.event.workflow_run.id }}
          CPH_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CPH_CONTROL_SHA: ${{ github.sha }}
        run: python3 tools/project/remote_gate.py --run-id "$CPH_RUN_ID" --attempt "$CPH_ATTEMPT" --control-sha "$CPH_CONTROL_SHA"
