name: CPH AI companion package

on:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - 'tools/actor_control/**'
      - 'src/actor_control_protocol_generated.h'
      - '.github/workflows/project-companion.yml'
  pull_request:
    paths:
      - 'companion/**'
      - 'tools/actor_control/**'
      - 'src/actor_control_protocol_generated.h'
      - '.github/workflows/project-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install fixed package tooling
        run: python -m pip install uv==0.12.17
      - name: Validate the single protocol source
        working-directory: .
        run: |
          python tools/actor_control/generate_protocol.py --check
          python -m unittest discover -s tools/actor_control -p 'test_*.py'
      - run: uv sync --locked --group build
      - run: uv run --locked python -m unittest discover -s tests
      - run: uv build --python .venv/bin/python --no-build-isolation --out-dir dist
      - run: uv run --locked python tools/build_release.py --dist dist --candidate-only
      - name: Verify the installed wheel outside the source checkout
        run: |
          uv venv "$RUNNER_TEMP/companion-installed" --python 3.12
          uv pip install --python "$RUNNER_TEMP/companion-installed/bin/python" --require-hashes -r dist/requirements.lock
          uv pip install --python "$RUNNER_TEMP/companion-installed/bin/python" --no-deps dist/cph_ai_companion-0.1.2.dev0-py3-none-any.whl
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/companion-installed/bin/python" -I -m unittest discover -s "$GITHUB_WORKSPACE/companion/tests"
          "$RUNNER_TEMP/companion-installed/bin/cph-ai-companion" init --profile "$RUNNER_TEMP/companion-profile" --actor-id 7
          "$RUNNER_TEMP/companion-installed/bin/cph-ai-companion" doctor --offline --profile "$RUNNER_TEMP/companion-profile"
      - name: Retain independent package candidates
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cph-ai-companion-candidate
          path: companion/dist/
          if-no-files-found: error

# This workflow builds offline package candidates. Native joint validation,
# real-model acceptance and publication remain separate claims.
