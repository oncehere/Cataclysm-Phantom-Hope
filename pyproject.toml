[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "po-keeper"
version = "0.1.0rc1"
description = "Reviewable local gettext translation maintenance with durable provenance"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["polib==1.2.0", "google-genai==1.43.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "build==1.3.0"]

[project.scripts]
pokeeper = "pokeeper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pokeeper"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/pokeeper", "/tests", "/scripts", "/examples", "/docs", "/README.md",
  "/LICENSE", "/pyproject.toml", "/requirements.lock", "/uv.lock", "/Containerfile",
  "/.dockerignore", "/.gitignore",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
