schema_version: 1
kind: project_map
description: Offline subsystem routing for human contributors and agents.
entries:
  - id: ai-companion
    paths: [companion/, tools/actor_control/, 'src/actor_control*', src/npc_execution_adapter.cpp, src/npc_execution_adapter.h, '.github/workflows/project-companion.yml']
    purpose: Independently packaged Python and Lua companion, single protocol source, and native NPC control integration.
    instructions: AGENTS.md
    validation_ids: [actor-control-protocol, companion-python, companion-package, companion-joint]
    boundaries:
      - companion/ retains its Apache-2.0 license and independent wheel, sdist and Mod distribution.
      - Native control and multiplayer keep separate identity, scheduling and observation rules.
      - Offline validation and Mod loading never start model calls.
  - id: engine
    paths: [src/]
    purpose: Native C++ engine, gameplay, UI, and Lua bindings.
    instructions: src/AGENTS.md
    validation_ids: [cpp-format, cpp-tests]
    boundaries:
      - Runtime behaviour is defined by source and tests.
      - Public JSON and Lua changes require contract-impact review.
  - id: core-data
    paths: [data/core/, data/json/]
    purpose: Core JSON definitions loaded by the game.
    instructions: data/AGENTS.md
    validation_ids: [json-syntax, json-load]
    boundaries:
      - Preserve stable IDs or provide explicit migration data.
  - id: lua-api
    paths: [data/lua/types/ccb_platform_v1.d.lua, 'data/lua/reference/ccb_platform_*', tools/lua_api/, tools/create_lua_mod.py, tools/test_create_lua_mod.py, data/lua/templates/, src/main.cpp, src/game_io.cpp, src/lua_platform_loader.cpp, src/lua_platform_runtime.cpp, 'src/lua_platform*.cpp', 'src/lua_platform*.h']
    purpose: Lua-first Platform v1 declarations, native inventory, public contract, synchronization coverage, and contract checks.
    instructions: data/lua/AGENTS.md
    validation_ids: [lua-contract, lua-authoring]
    boundaries:
      - Platform v1 declarations, registrations, generated inventory, and contract checks are authoritative.
      - This is a contract-validation route within the sole Platform runtime, not a second Lua system.
  - id: lua-first-platform
    paths: [data/lua/, data/mods/Lua_First_Example/, ai/lua-first-roadmap.yml, ai/lua-first-roadmap.schema.json, ai/lua-first-replacement-ledger.schema.json, tools/lua_api/, tools/agent/*lua_first*, tools/create_lua_mod.py, tools/migrate_lua_first.py, tools/lua_migration_output.py, 'src/lua_platform*.cpp', 'src/lua_platform*.h', src/mod_manager.cpp, src/mod_manager.h, src/mod_manager_ui.cpp, src/game_io.cpp, src/game.cpp, src/do_turn.cpp]
    purpose: Inherited Lua runtime in CPH, pure-Lua authoring architecture, EOC-capability workflow, replacement boundary, and checked implementation roadmap.
    instructions: data/lua/AGENTS.md
    validation_ids: [agent-context]
    boundaries:
      - The architecture contract defines target design; source and tests alone prove a capability is available.
      - Public Platform APIs use native domain objects and services rather than exposing JSON loaders or EOC-key-shaped wrappers.
      - API v5, CBN compatibility, authored Lua manifests, `game.*`, and a second Lua state are prohibited.
      - Core serialization such as saves, settings, caches, and generated inventories may remain JSON internally.
      - The exact replacement ledger distinguishes implemented, bounded-implemented, primitive-available, planned, private-adapter, and reviewed-not-applicable selectors.
      - Migration output is a reviewable Lua skeleton plus explicit TODO report, never a hidden JSON/EOC compatibility call.
  - id: bundled-mods
    paths: ['data/mods/*.json']
    purpose: JSON Mod definitions shipped and validated with CPH.
    instructions: data/mods/AGENTS.md
    validation_ids: [json-syntax, json-load]
    boundaries:
      - Each mod is an independent compatibility surface.
  - id: tests
    paths: ['tests/*.cpp', 'tests/*.h']
    purpose: Catch2 regression and integration tests.
    instructions: tests/AGENTS.md
    validation_ids: [cpp-tests]
    boundaries:
      - Tests must be deterministic and behaviour-focused.
  - id: developer-tools
    paths: [tools/]
    purpose: Formatters, validators, generators, and maintenance automation.
    instructions: tools/AGENTS.md
    validation_ids: [agent-context, python-tools]
    boundaries:
      - Generators provide a non-mutating check mode.
  - id: android
    paths: [android/]
    purpose: Android Gradle application, Java UI, and native packaging.
    instructions: android/AGENTS.md
    validation_ids: [android-unit]
    boundaries:
      - Never commit SDK paths, signing material, APKs, or local Gradle state.
  - id: build
    paths: [CMakeLists.txt, '*/CMakeLists.txt', CMakeModules/, CMakePresets.json, src/version.cmake, src/prefix.h.in, Makefile, build-scripts/]
    purpose: Build, validation, packaging, and continuous integration contracts.
    instructions: build-scripts/AGENTS.md
    validation_ids: [cmake-configure, cmake-regression]
    boundaries:
      - Actual build definitions override explanatory documentation.
  - id: governance
    paths:
      - AGENTS.md
      - CONTRIBUTING.md
      - GOVERNANCE.md
      - OWNERSHIP.md
      - REPOSITORY_SETTINGS.md
      - ai/repository-settings.target.yml
      - ai/repository-settings.target.schema.json
      - .github/dependabot.yml
      - .github/pull_request_template.md
      - .github/workflows/project-gate.yml
    purpose: Contribution, responsibility, and repository governance policy.
    instructions: AGENTS.md
    validation_ids: [agent-context, governance-audit]
    boundaries:
      - Every PR names a Responsible human.
      - Tracked targets never prove that an administrator setting is active.
      - Main gate activation requires real Windows/Linux checks and a trusted PR check path; a later protected PR probe establishes operation.
      - Verify live Issues and private vulnerability reporting settings before describing their availability.
  - id: github-automation
    paths: [.github/]
    purpose: GitHub workflows, templates, and automation permissions.
    instructions: .github/AGENTS.md
    validation_ids: [project-python, governance-audit, agent-context]
    boundaries:
      - Candidate checks run without privileged credentials; actual settings require readback.
  - id: project-tools
    paths: [tools/project/, project/]
    purpose: CPH synchronization, build, gate, and release tooling.
    instructions: tools/AGENTS.md
    validation_ids: [project-python, python-tools]
    boundaries:
      - Local regression results do not establish deployed gate acceptance.
  - id: project-tests
    paths: [tests/project/]
    purpose: Python regressions for CPH project automation.
    instructions: tests/AGENTS.md
    validation_ids: [project-python, python-tools]
    boundaries:
      - These unittest checks are distinct from Catch2 game tests and lint.
  - id: lua-mods
    paths: ['data/mods/*.lua']
    purpose: Pure Lua Platform Mod entrypoints and runtime content.
    instructions: data/mods/AGENTS.md
    validation_ids: [lua-contract, lua-mod-load, lua-playable-mvp]
    boundaries:
      - Use a Lua-enabled native binary and isolated userdir for the changed Mod ID.
      - JSON formatting alone cannot validate Lua loading or behaviour.
