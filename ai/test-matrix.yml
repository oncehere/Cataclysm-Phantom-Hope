schema_version: 1
kind: test_matrix
description: Acceptance-gate validation routing, not a per-edit execution mandate. Expensive commands may require platform dependencies.
entries:
  - id: actor-control-protocol
    paths: [tools/actor_control/, companion/src/cph_ai_companion/resources/protocol/, src/actor_control_protocol_generated.h, tests/actor_control_protocol_test.cpp]
    command: python3 tools/actor_control/generate_protocol.py --check && python3 -m unittest discover -s tools/actor_control -p 'test_*.py'
    workdir: .
    cost: fast
  - id: companion-python
    paths: [companion/]
    command: uv run --locked python -m unittest discover -s tests
    workdir: companion
    cost: fast
  - id: companion-package
    paths: [companion/, '.github/workflows/project-companion.yml']
    command: uv sync --locked --group build && uv build --python .venv/bin/python --no-build-isolation --out-dir dist && uv run --locked python tools/build_release.py --dist dist --candidate-only
    workdir: companion
    cost: medium
  - id: companion-joint
    paths: [companion/, tools/actor_control/, 'src/actor_control*', 'src/npc_execution_adapter*', tests/actor_control_joint_test.cpp]
    description: Run with a source-matching native test binary and an isolated interpreter containing the exact built wheel; no real model is called.
    command: 'CPH_COMPANION_JOINT_DRIVER="$PWD/companion/tools/joint_driver.py" CPH_COMPANION_PYTHON="${CPH_COMPANION_PYTHON:?Set the interpreter containing the installed wheel}" "${CPH_TEST_BINARY:?Set a source-matching native test binary}" "[.actor_control_joint]" --rng-seed 20261001'
    workdir: .
    cost: expensive
  - id: agent-context
    paths: [AGENTS.md, GOVERNANCE.md, ai/, tools/agent/]
    command: python3 -m unittest discover -s tools/agent -p 'test_*.py'
    workdir: .
    cost: fast
  - id: governance-audit
    paths:
      - OWNERSHIP.md
      - REPOSITORY_SETTINGS.md
      - ai/repository-settings.target.yml
      - ai/repository-settings.target.schema.json
      - .github/dependabot.yml
      - .github/workflows/
      - tools/agent/audit_repository_governance.py
      - tools/agent/test_repository_governance.py
    command: python3 tools/agent/audit_repository_governance.py --check
    workdir: .
    cost: fast
  - id: documentation-impact
    paths: [ai/docs-impact.yml, tools/agent/check_docs_impact.py, tools/agent/test_docs_impact.py, .github/pull_request_template.md, .github/workflows/project-gate.yml]
    command: python3 tools/agent/check_docs_impact.py --changed-file ai/docs-impact.yml && python3 -m unittest discover -s tools/agent -p 'test_docs_impact.py'
    workdir: .
    cost: fast
  - id: python-tools
    paths: ['tools/*.py', 'tests/project/*.py']
    command: make python-check
    workdir: .
    cost: fast
  - id: cpp-format
    paths: ['src/*.cpp', 'src/*.h', 'tests/*.cpp', 'tests/*.h', 'tools/*.cpp', 'tools/*.h']
    command: make astyle-check
    workdir: .
    cost: fast
  - id: cpp-tests
    paths: ['src/*.cpp', 'src/*.cc', 'src/*.c', 'src/*.h', 'src/*.hpp', 'src/*.ipp', 'src/*.inc', 'src/*.S', 'src/*.rc', 'tests/*.cpp', 'tests/*.h']
    command: make -j2 tests && ./tests/cata_test
    workdir: .
    cost: expensive
  - id: json-syntax
    paths: ['data/json/*.json']
    description: Limited syntax/type check of data/json only; does not load content or Mod dependencies.
    command: make -j2 json-check
    workdir: .
    cost: medium
  - id: json-load
    paths: ['data/core/*.json', 'data/json/*.json', 'data/mods/*.json']
    description: Native content/dependency loading. Use ccb for core or the changed Mod ID and a binary matching the source; missing inputs mean NOT_RUN.
    command: '"${CPH_GAME_BINARY:?Set a game binary matching the source}" --datadir ./data/ --userdir "${CPH_TEST_USERDIR:?Set an isolated temporary userdir}/" --configdir "${CPH_TEST_CONFIGDIR:?Set an isolated temporary config directory}/" --check-mods "${CPH_MOD_ID:?Set ccb for core or the changed Mod ID}"'
    workdir: .
    cost: medium
  - id: json-eoc-contract
    paths:
      - src/init.cpp
      - src/condition.cpp
      - src/npctalk.cpp
      - src/effect_on_condition.cpp
      - data/core/
      - data/json/
      - 'data/mods/*.json'
      - data/sound/
      - data/reference/json/
      - doc/JSON/
      - tools/json_api/
    command: python3 tools/json_api/generate_contracts.py --check && python3 -m unittest discover -s tools/json_api -p 'test_*.py'
    workdir: .
    cost: medium
  - id: lua-contract
    paths: [CMakeLists.txt, Makefile, tests/CMakeLists.txt, tests/Makefile, tests/test_support_sources.txt, src/CMakeLists.txt, src/lua/CMakeLists.txt, src/main.cpp, 'src/lua_platform*.cpp', 'src/lua_platform*.h', src/event.h, data/lua/, tools/lua_api/]
    command: python3 -m unittest discover -s tools/lua_api -p 'test_*.py'
    workdir: .
    cost: fast
  - id: lua-migration
    paths: [tools/migrate_lua_first.py, tools/lua_migration_output.py, tools/test_migrate_lua_first.py, 'tools/test_lua_*migration.py', tools/test_lua_named_predicate_migration.py, tools/test_migrate_lua_first_event_type.py, tools/test_native_math_domain_queries.py]
    command: python3 tools/test_migrate_lua_first.py && python3 -m unittest tools.test_migrate_lua_first_event_type
    workdir: .
    cost: fast
  - id: lua-authoring
    paths: [tools/create_lua_mod.py, tools/test_create_lua_mod.py, tools/lua_api/mod_sdk.py, tools/lua_api/test_mod_sdk.py, data/lua/templates/, data/lua/types/]
    command: python3 tools/test_create_lua_mod.py
    workdir: .
    cost: fast
  - id: lua-playable-mvp
    paths:
      - src/lua_platform_loader.cpp
      - src/lua_platform_runtime.cpp
      - src/lua_platform_runtime_dialogue.cpp
      - src/lua_platform_runtime_hooks.cpp
      - src/lua_platform_runtime_internal.h
      - src/lua_platform_runtime_lifecycle.cpp
      - src/lua_platform_runtime_services.cpp
      - src/lua_platform_content_presentation.cpp
      - src/lua_platform_content_presentation.h
      - src/lua_platform_content_worldgen.cpp
      - src/lua_platform_content_worldgen.h
      - src/lua_platform_content_items.cpp
      - src/lua_platform_content_items.h
      - src/lua_platform_content_creatures.cpp
      - src/lua_platform_content_creatures.h
      - src/lua_platform_content_character.cpp
      - src/lua_platform_content_character.h
      - src/game_io.cpp
      - src/mod_manager.cpp
      - src/mod_manager_ui.cpp
      - data/mods/Lua_First_Example/
      - 'tests/lua_platform*.cpp'
      - tests/mod_manager_test.cpp
    command: make -j1 BUILD_PREFIX=lua-native- ODIR="$PWD/build/lua-native-obj" CATA_ENABLE_LUA_PLATFORM=1 CATA_TEST_SUITE=lua ASTYLE=0 LINTJSON=0 LOCALIZE=0 DEBUGSYMS= tests && ./tests/lua-native-cata_test '[playable_mvp]' --rng-seed 20260812 --warn NoTests
    workdir: .
    cost: expensive
  - id: lua-disabled-build
    paths:
      - src/lua_platform_loader.cpp
      - src/lua_platform_runtime.cpp
      - src/lua_platform_runtime_dialogue.cpp
      - src/lua_platform_runtime_hooks.cpp
      - src/lua_platform_runtime_internal.h
      - src/lua_platform_runtime_lifecycle.cpp
      - src/lua_platform_runtime_services.cpp
      - src/lua_platform_content_presentation.cpp
      - src/lua_platform_content_presentation.h
      - src/lua_platform_content_worldgen.cpp
      - src/lua_platform_content_worldgen.h
      - src/lua_platform_content_items.cpp
      - src/lua_platform_content_items.h
      - src/lua_platform_content_creatures.cpp
      - src/lua_platform_content_creatures.h
      - src/lua_platform_content_character.cpp
      - src/lua_platform_content_character.h
      - src/mod_manager.cpp
      - data/mods/Lua_First_Example/
      - tests/mod_manager_test.cpp
      - 'tests/lua_platform_test*'
    command: make -j2 BUILD_PREFIX=lua-disabled- ODIR=lua-disabled-obj CATA_ENABLE_LUA_PLATFORM=0 ASTYLE=0 LINTJSON=0 LOCALIZE=0 DEBUGSYMS= tests && ./tests/lua-disabled-cata_test 'lua_first_platform_disabled_build_rejects_runtime_sources' --rng-seed 20260812
    workdir: .
    cost: expensive
  - id: cmake-configure
    paths: [CMakeLists.txt, '*/CMakeLists.txt', CMakeModules/, CMakePresets.json, src/version.cmake, src/prefix.h.in]
    command: cmake --preset linux-x64
    workdir: .
    cost: medium
  - id: cmake-regression
    paths: [CMakeLists.txt, '*/CMakeLists.txt', CMakeModules/, CMakePresets.json, src/version.cmake, src/prefix.h.in, 'tests/project/test_cmake*.py']
    command: python3 -m unittest discover -s tests/project -p 'test_cmake*.py'
    workdir: .
    cost: fast
  - id: android-unit
    paths: [android/]
    command: ./gradlew test
    workdir: android
    cost: expensive
  - id: project-python
    paths: [tools/project/, tests/project/, project/, '.github/workflows/project-*.yml']
    command: python3 -m unittest discover -s tests/project -p 'test_*.py'
    workdir: .
    cost: fast
  - id: lua-mod-load
    paths: ['data/mods/*.lua']
    command: '"${CPH_LUA_BINARY:?Set a Lua-enabled game binary matching the source}" --datadir ./data/ --userdir "${CPH_TEST_USERDIR:?Set an isolated temporary userdir}/" --configdir "${CPH_TEST_CONFIGDIR:?Set an isolated temporary config directory}/" --check-mods "${CPH_MOD_ID:?Set the changed Mod ID}"'
    workdir: .
    cost: medium
