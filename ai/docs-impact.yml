schema_version: 1
kind: docs_impact
description: Staged local and PR-review source-to-document contract. Public API and format changes require synchronized in-repository documentation review when this checker is run; current CPH workflows do not invoke it, so GitHub does not automatically block merges on these fields.
enforcement: staged
entries:
  - id: governance-policy
    enforcement: advisory
    patterns:
      - AGENTS.md
      - '*/AGENTS.md'
      - CONTRIBUTING.md
      - GOVERNANCE.md
      - OWNERSHIP.md
      - REPOSITORY_SETTINGS.md
      - ai/repository-settings.target.yml
      - ai/repository-settings.target.schema.json
      - .github/dependabot.yml
      - .github/pull_request_template.md
      - .github/workflows/project-gate.yml
      - tools/agent/audit_repository_governance.py
      - tools/agent/test_repository_governance.py
    documentation_ids: [contributing.responsible-human, getting-started.first-contribution]
    generated_reference_impact: false
    required_check_ids: []
    risk_group: governance
    risk_level: high

  - id: project-routing
    enforcement: advisory
    patterns: [ai/project-map.yml, ai/test-matrix.yml, ai/generated-files.yml, ai/docs-impact.yml]
    documentation_ids: [architecture.project-map, validation.quickstart]
    generated_reference_impact: false
    required_check_ids: []
    risk_group: project-context
    risk_level: normal

  - id: build-contracts
    enforcement: advisory
    patterns: [CMakeLists.txt, CMakeModules/*, CMakePresets.json, Makefile, build-scripts/*, .github/workflows/*]
    documentation_ids: [validation.quickstart]
    generated_reference_impact: false
    required_check_ids: []
    risk_group: build
    risk_level: high

  - id: lua-public-contract
    enforcement: required
    patterns:
      - src/lua_platform*
      - src/event.h
      - data/lua/types/ccb_platform_v1.d.lua
      - data/lua/reference/ccb_platform_*
      - tools/lua_api/*
    documentation_ids:
      - lua.platform.overview
    generated_reference_impact: true
    required_check_ids: [documentation-impact, lua-contract]
    documentation_readiness:
      state: in_repository_review_required
      repository: oncehere/Cataclysm-Phantom-Hope
      documents:
        - id: lua.platform.overview
          path: data/lua/README.md
    risk_group: lua-api
    risk_level: high

  - id: lua-first-platform
    enforcement: advisory
    patterns:
      - data/lua/LUA_FIRST_PLATFORM.md
      - data/lua/LUA_FIRST_EOC_WORKFLOW.md
      - ai/lua-first-roadmap.yml
      - ai/lua-first-roadmap.schema.json
      - tools/agent/generate_lua_first_replacement_ledger.py
      - tools/agent/check_lua_first_replacement_ledger.py
      - ai/lua-first-replacement-ledger.schema.json
      - data/lua/types/ccb_platform_v1.d.lua
      - data/lua/templates/**
      - data/mods/Lua_First_Example/**
      - tools/create_lua_mod.py
      - tools/migrate_lua_first.py
      - src/lua_platform_loader.cpp
      - src/lua_platform_loader.h
      - src/lua_platform_runtime.cpp
      - src/lua_platform_runtime.h
      - src/lua_platform_runtime_services.cpp
      - src/lua_platform_content_presentation.cpp
      - src/lua_platform_content_presentation.h
      - src/lua_platform_content_worldgen.cpp
      - src/lua_platform_content_worldgen.h
      - src/lua_platform_content_items.cpp
      - src/lua_platform_content_items.h
      - src/lua_platform_content_creatures.cpp
      - src/lua_platform_content_creatures.h
      - src/lua_platform_content_character.cpp
      - src/lua_platform_content_character.h
      - src/lua_platform_content.h
      - src/lua_platform_world_content.cpp
      - src/lua_platform_world_content.h
      - src/lua_platform_hooks.cpp
      - src/lua_platform_hooks.h
      - src/mod_manager.cpp
      - src/mod_manager.h
      - src/mod_manager_ui.cpp
      - src/game_io.cpp
      - src/game.cpp
      - src/do_turn.cpp
    documentation_ids:
      - cpp.lua-bridge
      - architecture.lua-first-glossary
      - architecture.lua-first-eoc-workflow
    generated_reference_impact: false
    required_check_ids: [agent-context]
    risk_group: lua-platform
    risk_level: high

  - id: json-public-contract
    enforcement: required
    patterns:
      - data/reference/json/ccb_json_object_types.json
      - src/init.cpp
      - src/generic_factory.h
      - src/*factory*
      - tools/json_api/*
    documentation_ids:
      - json.object-types
      - json.inheritance
    generated_reference_impact: true
    required_check_ids: [documentation-impact, json-eoc-contract]
    documentation_readiness:
      state: in_repository_review_required
      repository: oncehere/Cataclysm-Phantom-Hope
      documents:
        - id: json.object-types
          path: doc/JSON/JSON_INFO.md
        - id: json.inheritance
          path: doc/JSON/JSON_INHERITANCE.md
    risk_group: json-api
    risk_level: high

  - id: eoc-public-contract
    enforcement: required
    patterns:
      - data/reference/json/ccb_eoc_conditions.json
      - data/reference/json/ccb_eoc_effects.json
      - src/condition.cpp
      - src/npctalk.cpp
      - src/effect_on_condition.cpp
      - src/effect_on_condition.h
      - tools/json_api/*
    documentation_ids:
      - eoc.reference
    generated_reference_impact: true
    required_check_ids: [documentation-impact, json-eoc-contract]
    documentation_readiness:
      state: in_repository_review_required
      repository: oncehere/Cataclysm-Phantom-Hope
      documents:
        - id: eoc.reference
          path: doc/JSON/EFFECT_ON_CONDITION.md
    risk_group: eoc-api
    risk_level: high

  - id: json-eoc-content
    enforcement: advisory
    patterns: [data/core/*, data/json/*, data/mods/*, data/sound/*, doc/JSON/*]
    documentation_ids: [json.overview, eoc.overview, mods.complete-json-eoc-mod]
    generated_reference_impact: false
    required_check_ids: []
    risk_group: json-eoc-content
    risk_level: normal

  - id: json-serialization
    enforcement: advisory
    patterns: [src/*json*]
    documentation_ids: [compatibility.save, json.overview]
    generated_reference_impact: false
    required_check_ids: []
    risk_group: serialization
    risk_level: high
