schema_version: 1
kind: task_router
description: Deterministic task-to-context routing for contributors and agents.
entries:
  - id: repository-navigation
    keywords: [navigate, locate, repository, project map, 定位, 仓库, 项目地图]
    paths: [AGENTS.md, ai/, tools/agent/]
    project_ids: [governance, developer-tools]
    documentation_ids: [architecture.project-map, architecture.subsystem-map]
    source_symbols: []
    validation_ids: [agent-context]
    compatibility:
      - Respect generated-file and nested AGENTS boundaries before editing.
    upstream_differences:
      - CPH paths and validation metadata override inherited repository guides.
  - id: cpp-bug
    keywords: [C++, segfault, native crash, 原生崩溃]
    paths: [src/, 'tests/*.cpp', 'tests/*.h']
    project_ids: [engine, tests]
    documentation_ids: [architecture.overview, validation.debugging, validation.testing]
    source_symbols: []
    validation_ids: [cpp-format, cpp-tests]
    compatibility:
      - Review object ownership, lifecycle, serialization, and public IDs.
    upstream_differences:
      - Upstream fixes require a CPH divergence and compatibility review.
  - id: json-content
    keywords: [JSON, JSON content, JSON数据]
    paths: [data/json/, data/core/, tools/json_tools/]
    project_ids: [core-data]
    documentation_ids: [json.overview, compatibility.mods]
    source_symbols: []
    validation_ids: [json-load]
    compatibility:
      - Preserve stable IDs or provide explicit migration or obsoletion data.
    upstream_differences:
      - Confirm the current CPH loader and registered type before copying upstream JSON.
  - id: eoc
    keywords: [EOC, effect_on_condition, talker]
    paths: [data/json/effects_on_condition/, src/condition.cpp, src/effect_on_condition.cpp]
    project_ids: [core-data, bundled-mods]
    documentation_ids: [eoc.overview, reference.eoc-conditions, reference.eoc-effects]
    source_symbols: [effect_on_condition]
    validation_ids: [json-load]
    compatibility:
      - Validate talkers, variable scope, nesting, defaults, and load context.
    upstream_differences:
      - EOC syntax may differ when current CPH registrations lag or diverge from upstream.
  - id: lua-api
    keywords: [Lua, LuaLS, Platform, callback, hook, 脚本, 能力]
    paths: [data/lua/, tools/lua_api/, src/main.cpp, src/game_io.cpp, 'src/lua_platform*.cpp', 'src/lua_platform*.h']
    project_ids: [lua-api]
    documentation_ids: [architecture.lua-first-platform, architecture.lua-first-glossary]
    source_symbols: [platform_version]
    validation_ids: [lua-contract]
    compatibility:
      - Keep Platform metadata, LuaLS, native registration, native inventory, public contract, synchronization coverage, examples, and runtime validation in parity.
    upstream_differences:
      - The inherited Platform v1 is the current CPH contract and is not inferred from CBN or CDDA APIs.
  - id: lua-first-platform
    keywords: [Lua-first, Platform v1, pure Lua, main.lua, mod.lua, zero-config, JSON replacement, EOC replacement, 纯 Lua, 零配置, 替代 JSON, 替代 EOC]
    paths: [data/lua/LUA_FIRST_PLATFORM.md, ai/lua-first-roadmap.yml, ai/lua-first-roadmap.schema.json, ai/lua-first-replacement-ledger.schema.json, data/lua/, data/mods/Lua_First_Example/, tools/lua_api/, tools/agent/*lua_first*, tools/create_lua_mod.py, tools/migrate_lua_first.py, 'src/lua_platform*.cpp', 'src/lua_platform*.h']
    project_ids: [lua-first-platform, lua-api]
    documentation_ids: [architecture.lua-first-platform, architecture.lua-first-roadmap, architecture.lua-first-glossary]
    source_symbols: []
    validation_ids: [agent-context, lua-contract]
    compatibility:
      - Treat roadmap status as planning data; only matching runtime source and tests establish implemented behaviour.
      - Preserve stable content ids and saves during incremental migration.
    upstream_differences:
      - Platform v1 is the current inherited CPH architecture and must not be inferred from Lua v5, CBN, CDDA, JSON keys, or EOC keys.
  - id: upstream-port
    keywords: [upstream, port, cherry-pick, CDDA, CBN, 上游, 移植]
    paths: [CONTRIBUTING.md, SYNC_EXCLUDED_PRS.md]
    project_ids: [governance, engine, core-data]
    documentation_ids: [maintenance.upstream-sync]
    source_symbols: []
    validation_ids: [cpp-format, cpp-tests, json-load]
    compatibility:
      - Record provenance and inspect save, JSON ID, mod, Lua, and platform impact.
    upstream_differences:
      - Shared ancestry does not make newer upstream behaviour authoritative for CPH.
  - id: save-compatibility
    keywords: [save, load, serialization, migration, world, 存档, 加载, 序列化, 迁移]
    paths: [src/savegame.cpp, src/savegame_json.cpp, src/savegame_legacy.cpp, src/worldfactory.cpp]
    project_ids: [engine, tests]
    documentation_ids: [compatibility.save]
    source_symbols: []
    validation_ids: [cpp-format, cpp-tests]
    compatibility:
      - Test migrations on copies through two save/load cycles and preserve stable IDs.
    upstream_differences:
      - Compare the exact CPH save version and migrations before adopting upstream code.
  - id: generated-file-detection
    keywords: [generated, generator, inventory, schema, 生成, 生成器, 清单]
    paths: [ai/generated-files.yml, 'tools/agent/generate_*.py', 'tools/lua_api/generate_*.py', tools/json_api/generate_contracts.py]
    project_ids: [developer-tools]
    documentation_ids: [contributing.documentation-policy]
    source_symbols: []
    validation_ids: [agent-context, python-tools]
    compatibility:
      - Modify the source or generator and use its non-mutating check mode.
    upstream_differences:
      - Generated boundaries are repository-specific and must be re-discovered in CPH.
  - id: documentation-impact
    keywords: [documentation, docs impact, stale, translation, 文档, 影响, 翻译]
    paths: [ai/docs-impact.yml, ai/documentation-registry.yml, docs/project/, doc/, .github/pull_request_template.md, tools/agent/check_docs_impact.py]
    project_ids: [governance, developer-tools]
    documentation_ids: [lua.platform.overview, json.object-types, eoc.reference]
    source_symbols: []
    validation_ids: [documentation-impact]
    compatibility:
      - Scope drift to declared source paths and update mapped CPH documentation in the same repository change.
    upstream_differences:
      - Historical CCB-Docs pages do not override current CPH source or in-repository documentation.
  - id: project-tooling
    keywords: [project tooling, project tests, 项目测试]
    paths: [tools/project/, tests/project/, project/]
    project_ids: [project-tools, project-tests]
    documentation_ids: [architecture.project-map]
    source_symbols: []
    validation_ids: [project-python, python-tools]
    compatibility:
      - Run project unittest behaviour checks separately from Python lint.
    upstream_differences:
      - These are CPH automation contracts, not Catch2 game tests.
  - id: github-automation
    keywords: [GitHub Actions, workflow, 工作流]
    paths: [.github/]
    project_ids: [github-automation]
    documentation_ids: [architecture.project-map]
    source_symbols: []
    validation_ids: [project-python, governance-audit]
    compatibility:
      - Read .github/AGENTS.md and validate permissions and trusted workflow boundaries.
    upstream_differences:
      - CPH workflow contracts and live settings must be verified independently.
  - id: json-mod
    keywords: [JSON Mod, JSON 模组]
    paths: ['data/mods/*.json']
    project_ids: [bundled-mods]
    documentation_ids: [compatibility.mods]
    source_symbols: []
    validation_ids: [json-load, json-eoc-contract]
    compatibility:
      - Preserve stable IDs and validate the changed Mod loader as well as JSON format.
    upstream_differences:
      - Verify actual CPH JSON registrations before importing upstream content.
  - id: lua-mod
    keywords: [pure Lua Mod, 纯 Lua Mod, 纯Lua模组]
    paths: ['data/mods/*.lua']
    project_ids: [lua-mods, lua-api]
    documentation_ids: [architecture.lua-first-platform]
    source_symbols: []
    validation_ids: [lua-contract, lua-mod-load, lua-playable-mvp]
    compatibility:
      - Use the actual Mod ID and a Lua-enabled loader in an isolated userdir.
    upstream_differences:
      - CPH uses its sole Platform runtime rather than upstream Lua compatibility systems.
